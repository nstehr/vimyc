[package]
name = "vimyc"
version = "0.1.0"
edition = "2024"

# No runtime dependencies on purpose. The lexer, parser, type checker and
# evaluator are hand-written — that is the point of the project. Reach for
# `miette` or `ariadne` only once diagnostics are worth polishing, and for a
# wasm backend only once the interpreter is correct.
[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
