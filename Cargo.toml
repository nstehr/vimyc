[package]
name = "vimyc"
version = "0.1.0"
edition = "2024"

# The compiler itself is hand-written — lexer, parser, type checker, evaluator.
# That is the point of the project, so those stay dependency-free.
#
# serde is the exception: game state has to cross between Rust and Go for the
# differential test, and hand-rolling a JSON parser teaches nothing this project
# is about.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
