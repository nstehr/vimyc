[package]
name = "vimyc"
version = "0.1.0"
edition = "2024"

# The compiler itself is hand-written — lexer, parser, type checker, evaluator.
# That is the point of the project, so those stay dependency-free.
#
# serde is the exception: game state has to cross between Rust and Go for the
# differential test, and hand-rolling a JSON parser teaches nothing this project
# is about.
[dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser can land one ULP
# off, so a doctrine value would not survive the trip from Go. That shifted a
# reserve threshold by a credit — see docs/differential.md.
serde_json = { version = "1", features = ["float_roundtrip"] }
